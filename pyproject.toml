[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "de-identification-data-sharing-pipeline"
version = "0.1.0"
description = "HIPAA Safe Harbor de-identification and re-identification risk assessment pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4.0",
    "spacy>=3.8,<4.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
